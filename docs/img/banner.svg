<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Irium banner">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3B0"/>
      <stop offset="0.45" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#B87E00"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD84D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFD84D" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFD84D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="220" rx="18" fill="#0A0A0B"/>
  <rect x="1" y="1" width="878" height="218" rx="17" fill="none" stroke="#26262B" stroke-width="2"/>

  <!-- gem -->
  <g transform="translate(72,62)">
    <polygon points="16,4 48,4 64,20 32,60 0,20" fill="url(#gold)"/>
    <g stroke="#0A0A0B" stroke-width="1.6" fill="none" opacity="0.55">
      <line x1="16" y1="4" x2="0" y2="20"/>
      <line x1="48" y1="4" x2="64" y2="20"/>
      <line x1="16" y1="4" x2="10" y2="20"/>
      <line x1="48" y1="4" x2="54" y2="20"/>
      <line x1="0" y1="20" x2="64" y2="20"/>
      <line x1="10" y1="20" x2="32" y2="60"/>
      <line x1="54" y1="20" x2="32" y2="60"/>
    </g>
    <polygon points="16,4 48,4 54,20 10,20" fill="#FFFFFF" opacity="0.14"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFD84D">
    <path d="M148 34 l2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z"/>
    <path d="M700 170 l1.8 4.5 4.5 1.8 -4.5 1.8 -1.8 4.5 -1.8 -4.5 -4.5 -1.8 4.5 -1.8 Z" opacity="0.7"/>
    <path d="M760 52 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" opacity="0.5"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="16" fill="#EDEDF0">IRIUM</text>

  <!-- tagline -->
  <text x="204" y="166" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="5.2" fill="#8B8B93">THE RARE ELEMENT OF MODDING</text>

  <rect x="204" y="92" width="330" height="2" fill="url(#goldLine)"/>
</svg>
